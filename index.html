<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>

    <link rel="stylesheet" href="login.css">
</head>

<body>

    <div class="center">

        <h1>LOGIN</h1>

        <form id="loginForm" onsubmit="entrar(event)">

            <div class="txt_field">
                <input
                    type="email"
                    id="usuario"
                    required
                    autocomplete="email"
                >
                <label for="usuario">E-mail:</label>
            </div>

            <div class="txt_field">
                <input
                    type="password"
                    id="senha"
                    required
                    autocomplete="current-password"
                >
                <label for="senha">Senha:</label>
            </div>

            <div class="pass">
                Esqueceu sua senha?
            </div>

            <input
                type="submit"
                value="Login"
                id="loginBtn"
            >

            <div class="signup_link">
                <a href="#">Não tem conta? Cadastre-se!</a>
            </div>

        </form>

        <p id="mensagem"></p>

    </div>

    <script type="module" src="script.js"></script>

</body>

</html>
